<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ANBIYA Barcode Scanner</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 14px;
  min-height: 100vh;
}

h2 {
  text-align: center;
  margin: 8px 0 4px;
}

.sub {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

.scanner {
  position: relative;
  background: black;
  border-radius: 16px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 430px;
  display: block;
  object-fit: cover;
  background: black;
}

.frame {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 35%;
  height: 30%;
  border: 3px solid #00ff66;
  border-radius: 12px;
  pointer-events: none;
}

.line {
  position: absolute;
  left: 11%;
  right: 11%;
  top: 50%;
  height: 2px;
  background: #00ff66;
  box-shadow: 0 0 10px #00ff66;
  animation: scan 1.4s linear infinite;
  pointer-events: none;
}

@keyframes scan {

  0% {
    top: 35%;
  }

  50% {
    top: 65%;
  }

  100% {
    top: 35%;
  }

}

.status {
  margin: 12px 0;
  padding: 12px;
  border-radius: 10px;
  background: #222;
  text-align: center;
}

.result {
  background: #1d1d1d;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  word-break: break-all;
}

.code {
  font-size: 24px;
  font-weight: bold;
  margin-top: 6px;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
}

#start {
  background: #00d95f;
  color: #07130b;
}

#stop {
  background: #333;
  color: white;
}

.hint {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 12px;
}

</style>

</head>

<body>

<div class="app">

<h2>📷 ANBIYA BARCODE SCANNER</h2>

<div class="sub">
Live scan • otomatis • tanpa tombol foto
</div>

<div class="scanner">

<video
id="video"
autoplay
muted
playsinline>
</video>

<div class="frame"></div>

<div class="line"></div>

</div>

<div id="status" class="status">
Kamera akan aktif otomatis saat scanner dibuka.
</div>

<div class="result">

Hasil scan:

<div id="code" class="code">
—
</div>

</div>

<button id="start">
📷 MULAI SCAN
</button>

<button id="stop">
⏹ STOP
</button>

<div class="hint">

Izinkan kamera Chrome.
<br>

Arahkan barcode ke kotak hijau.

</div>

</div>


<script type="module">

import {
  BrowserMultiFormatReader
} from "https://esm.sh/@zxing/browser@0.2.1";


const video =
  document.getElementById("video");

const statusEl =
  document.getElementById("status");

const codeEl =
  document.getElementById("code");


let reader = null;

let controls = null;

let busy = false;


function status(text) {

  statusEl.textContent = text;

}


/* =========================
   KIRIM BARCODE KE POS
========================= */

function sendToPOS(code) {
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(
        {
          type: "ANBIYA_BARCODE",
          barcode: String(code).trim()
        },
        "*"
      );
      return true;
    }
  } catch (e) {
    console.log("Gagal kirim ke POS:", e);
  }
  return false;
}


/* =========================
   START SCANNER
========================= */

async function startScanner() {

  if (busy) {

    return;

  }

  busy = true;

  codeEl.textContent = "—";

  status(
    "Meminta izin kamera..."
  );


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    /* Buat scanner */

    reader =
      new BrowserMultiFormatReader();


    status(
      "Mencari kamera belakang..."
    );


    /* Cari kamera */

    const devices =
      await BrowserMultiFormatReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "Kamera HP tidak ditemukan."
      );

    }


    console.log(
      "Daftar kamera:",
      devices
    );


    /* Pilih kamera belakang */

    let selectedDevice =
      devices[devices.length - 1];


    const backCamera =
      devices.find(
        device =>
          /back|rear|environment|belakang/i
            .test(device.label)
      );


    if (backCamera) {

      selectedDevice =
        backCamera;

    }


    status(
      "Kamera aktif — arahkan barcode ke kotak hijau."
    );


    /* Mulai scan */

    controls =
      await reader.decodeFromVideoDevice(
        selectedDevice.deviceId,
        video,
        (result, error) => {

          if (!result) {

            return;

          }


          const code =
            result.getText();


          if (!code) {

            return;

          }


          console.log(
            "BARCODE:",
            code
          );


          codeEl.textContent =
            code;


          status(
            "✅ Barcode berhasil terbaca!"
          );


          const sent = sendToPOS(code);

          /* Stop setelah berhasil lalu kembali ke POS */
          setTimeout(() => {
            stopScanner();
            if (sent && window.opener && !window.opener.closed) {
              try { window.opener.focus(); } catch (e) {}
              try { window.close(); } catch (e) {}
            }
          }, 450);


        }
      );


  } catch (error) {

    console.error(
      "SCANNER ERROR:",
      error
    );


    status(
      "❌ Kamera gagal dibuka: " +
      (
        error.message ||
        error
      )
    );


    busy = false;

  }

}


/* =========================
   STOP
========================= */

function stopScanner() {

  try {

    if (controls) {

      controls.stop();

    }

  } catch (e) {}


  controls = null;


  try {

    if (reader) {

      reader.reset();

    }

  } catch (e) {}


  try {

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(
          track => track.stop()
        );

      video.srcObject = null;

    }

  } catch (e) {}


  busy = false;

}


/* =========================
   BUTTON
========================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startScanner
  );


document
  .getElementById("stop")
  .addEventListener(
    "click",
    () => {

      stopScanner();

      status(
        "Scanner dihentikan."
      );

    }
  );


/* Auto-start ketika dibuka dari tombol SCAN di POS. */
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    startScanner();
  }, 250);
});

window.addEventListener(
  "pagehide",
  stopScanner
);

</script>

</body>
</html>
