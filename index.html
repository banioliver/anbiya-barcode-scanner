<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ANBIYA Barcode Scanner</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{width:min(100%,520px);padding:14px}
  h1{font-size:20px;margin:8px 0 4px;text-align:center}
  .sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:12px}
  .viewer{
    position:relative;
    background:#000;
    border:2px solid #333;
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:3/4;
  }
  video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .frame{
    position:absolute;
    left:7%;
    right:7%;
    top:37%;
    height:22%;
    border:2px solid #22c55e;
    border-radius:8px;
    pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.12);
  }
  .laser{
    position:absolute;
    left:2%;
    right:2%;
    top:50%;
    height:2px;
    background:#ef4444;
    box-shadow:0 0 8px #ef4444;
  }
  .status{
    margin-top:12px;
    min-height:44px;
    padding:12px;
    border-radius:10px;
    background:#171717;
    text-align:center;
    font-size:14px;
  }
  button{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:10px;
    padding:13px;
    font-weight:700;
    cursor:pointer;
  }
  .green{background:#16a34a;color:#fff}
  .gray{background:#333;color:#fff}
  .code{
    margin-top:10px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    word-break:break-all;
  }
  .hint{text-align:center;color:#999;font-size:12px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <h1>📷 ANBIYA BARCODE SCANNER</h1>
  <div class="sub">Live scanner untuk POS ANBIYA</div>

  <div class="viewer">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"><div class="laser"></div></div>
  </div>

  <div id="status" class="status">Memulai kamera...</div>
  <div id="lastCode" class="code"></div>

  <button class="green" onclick="startScanner()">🔄 MULAI / ULANG SCAN</button>
  <button class="gray" onclick="closeScanner()">✕ TUTUP SCANNER</button>

  <div class="hint">
    Izinkan akses kamera jika diminta.<br>
    Kamera belakang diprioritaskan. Arahkan barcode ke garis merah.
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
let codeReader = null;
let controls = null;
let lastCode = '';
let lastTime = 0;
let busy = false;

const POS_ORIGIN = 'https://banioliver.github.io';

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 1800;
    osc.type = 'square';
    gain.gain.value = 0.05;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
    setTimeout(()=>{try{ctx.close()}catch(e){}},150);
  }catch(e){}
}

function sendBarcode(value){
  if(!window.opener || window.opener.closed){
    setStatus('⚠️ POS utama tidak ditemukan. Buka scanner dari tombol SCAN di POS.');
    return;
  }

  try{
    window.opener.postMessage(
      {type:'ANBIYA_BARCODE', barcode:value},
      '*'
    );
  }catch(e){
    setStatus('Gagal mengirim barcode ke POS.');
  }
}

window.addEventListener('message', function(event){
  if(event.origin !== POS_ORIGIN) return;
  if(!event.data || event.data.type !== 'ANBIYA_BARCODE_RECEIVED') return;
  busy = false;
  setStatus('🔎 SIAP — scan produk berikutnya');
});

async function startScanner(){
  try{
    if(controls){
      try{controls.stop()}catch(e){}
      controls = null;
    }

    if(!codeReader){
      codeReader = new ZXing.BrowserMultiFormatReader();
    }

    busy = false;
    setStatus('📷 Meminta izin kamera...');

    /*
     * deviceId kosong + constraints environment:
     * ZXing akan mencoba kamera belakang pada HP.
     */
    controls = await codeReader.decodeFromConstraints(
      {
        audio:false,
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1280},
          height:{ideal:720}
        }
      },
      document.getElementById('video'),
      (result, err) => {
        if(!result || busy) return;

        const value = String(result.getText() || '').trim();
        if(!value) return;

        const now = Date.now();
        if(value === lastCode && now - lastTime < 1200) return;

        lastCode = value;
        lastTime = now;
        busy = true;

        document.getElementById('lastCode').textContent = value;
        setStatus('✅ Barcode terbaca — mengirim ke POS...');
        beep();
        if(navigator.vibrate){
          try{navigator.vibrate(80)}catch(e){}
        }

        sendBarcode(value);

        /*
         * Jika opener memberi konfirmasi, scanner tetap hidup.
         * Kalau tidak ada konfirmasi, tetap bisa scan lagi setelah 1 detik.
         */
        setTimeout(()=>{busy=false; setStatus('🔎 SIAP — scan produk berikutnya')},1000);
      }
    );

    setStatus('🔎 SCAN OTOMATIS — arahkan barcode ke garis merah');
  }catch(error){
    console.error(error);
    setStatus(
      '❌ Kamera tidak bisa dibuka. Pastikan Chrome/HTTPS dan izin kamera sudah diizinkan.'
    );
  }
}

function closeScanner(){
  try{
    if(controls){
      controls.stop();
      controls = null;
    }
  }catch(e){}
  try{
    if(codeReader) codeReader.reset();
  }catch(e){}
  try{window.close()}catch(e){}
}

window.addEventListener('load', ()=>{
  startScanner();
});
</script>
</body>
</html>
